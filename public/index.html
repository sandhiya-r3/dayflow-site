<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DayFlow</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236C5CE7'/%3E%3Cpath d='M8 20c3-8 5-8 8 0s5 8 8 0' fill='none' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

<body>
  <div class="app" id="app"></div>
  <nav class="tabbar" id="tabbar" aria-label="Sections" hidden>
    <div class="tabbar-in" role="tablist">
      <button class="tab" role="tab" data-tab="today" id="tab-today">

      </button>
      <button class="tab" role="tab" data-tab="community" id="tab-community">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6"/><path d="M18 14.3c2 .7 3.5 2.7 3.5 5.2"/></svg>Community

      <button class="tab" role="tab" data-tab="insights" id="tab-insights">

  </nav>

  <script src="/app.js"></script>
